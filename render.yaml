# Zeelo — Render Blueprint (https://render.com/docs/blueprint-spec)
# Deploys: PostgreSQL + Redis (Key Value) + API (NestJS) + Admin (Next.js) + Mobile web build (Expo, static).
# Render → New → Blueprint → pick this repo. Secrets are generated by Render; nothing secret lives in git.
#
# Public URLs: Render gives each service https://<name>.onrender.com. If a name is already taken Render adds a
# suffix — then update the four *_URL / CORS values below (search "onrender.com") and redeploy.
#
# Notes for the free plan:
#  - Free web services sleep after ~15 min idle; the first request then takes ~1 min to wake.
#  - Free PostgreSQL expires after 30 days (upgrade the plan to keep data).
#  - Local disk is ephemeral: uploaded KYC documents are lost on restart (use object storage for real use).
#  - NODE_ENV=production forces OTP echo and the sandbox payment provider OFF (see apps/api/src/config/env.ts).

databases:
  - name: zeelo-db
    plan: free
    databaseName: zeelo
    user: zeelo

services:
  # ── Redis (Key Value) — the API requires it in production for OTPs, rate limits and job locks ──
  - type: keyvalue
    name: zeelo-kv
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # internal connections only

  # ── API ──
  - type: web
    name: zeelo-api
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm ci --include=dev && npm run build -w @orgil/api
    # Migrate, optionally load demo data (idempotent), then start.
    startCommand: >-
      cd apps/api &&
      npx prisma migrate deploy &&
      if [ "$SEED_DEMO_DATA" = "true" ]; then npx ts-node --transpile-only prisma/seed.ts; fi &&
      node dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zeelo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zeelo-kv
          property: connectionString
      - key: CORS_ORIGINS
        value: https://zeelo-mobile.onrender.com,https://zeelo-admin.onrender.com
      - key: PUBLIC_API_URL
        value: https://zeelo-api.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ADMIN_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true # base64-encoded 256-bit value, as the API requires
      - key: HMAC_KEY
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: mock
      - key: UPLOAD_DIR
        value: ./uploads
      # Demo data: seeds sample customers/loans (password Demo1234). Set to "false" before real use.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SEED_ADMIN_EMAIL
        value: admin@zeelo.mn
      # Generated admin password — read it in Render → zeelo-api → Environment. Used only on first seed.
      - key: SEED_ADMIN_PASSWORD
        generateValue: true

  # ── Admin dashboard ──
  - type: web
    name: zeelo-admin
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w @orgil/admin
    startCommand: cd apps/admin && npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: API_URL
        value: https://zeelo-api.onrender.com

  # ── Mobile app (web build) — the same Expo app, served as a static site ──
  - type: web
    name: zeelo-mobile
    runtime: static
    buildCommand: npm ci --include=dev && cd apps/mobile && npx expo export -p web --output-dir dist
    staticPublishPath: apps/mobile/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_PUBLIC_API_URL
        value: https://zeelo-api.onrender.com
