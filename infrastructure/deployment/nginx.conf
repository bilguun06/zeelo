# TLS-terminating reverse proxy (example). Certificates via Let's Encrypt/certbot or your CA.
# api.orgil.example  → API (mobile app talks here)
# admin.orgil.example → admin dashboard (restrict by VPN / office IP allow-list)

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
  listen 80;
  server_name api.orgil.example admin.orgil.example;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api.orgil.example;
  ssl_certificate     /etc/letsencrypt/live/api.orgil.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.orgil.example/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 10m;           # KYC uploads (API enforces MAX_UPLOAD_MB)
  location / {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;
  }
  location /docs { deny all; }        # Swagger is disabled in production; belt and braces
}

server {
  listen 443 ssl http2;
  server_name admin.orgil.example;
  ssl_certificate     /etc/letsencrypt/live/admin.orgil.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.orgil.example/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # allow 203.0.113.0/24;  # office / VPN range
  # deny all;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
